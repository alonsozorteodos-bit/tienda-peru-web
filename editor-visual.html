<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Editor Visual · Tienda Perú</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --red:#C8251A; --red-dark:#9B1B12; --gold:#D4A017; --dark:#0f0f0f;
  --gray:#F5F5F5; --gray2:#E8E8E8; --text:#1a1a1a; --white:#fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Poppins",sans-serif;color:var(--text);background:var(--gray);padding-bottom:100px;}

/* BARRA FLOTANTE DE CONTROL */
.editor-topbar{position:fixed;top:0;left:0;right:0;background:var(--dark);color:#fff;padding:12px 30px;display:flex;justify-content:space-between;align-items:center;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.editor-topbar h2{font-size:1rem;font-family:"Playfair Display",serif;color:var(--gold);}
.editor-actions{display:flex;gap:12px;}
.btn-save-all{background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;padding:8px 20px;border-radius:20px;font-weight:700;font-size:0.75rem;cursor:pointer;transition:all 0.2s;}
.btn-save-all:hover{transform:scale(1.05);}
.btn-back{background:rgba(255,255,255,0.1);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:0.75rem;cursor:pointer;text-decoration:none;}

/* CONTENEDOR VISUAL EDICIÓN */
.editor-container{max-width:1200px;margin:100px auto 30px;padding:20px;}
.editor-banner{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;padding:25px;border-radius:14px;margin-bottom:30px;text-align:center;}
.editor-banner h1{font-family:"Playfair Display",serif;font-size:1.8rem;margin-bottom:8px;}
.editor-banner p{font-size:0.85rem;opacity:0.9;}

.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
.live-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);position:relative;border:2px dashed transparent;transition:all 0.2s;}
.live-card:hover{border-color:var(--gold);}
.live-card img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin-bottom:12px;}

/* CAMPOS EDITABLES EN VIVO */
[contenteditable="true"]{outline:none;border-bottom:1px dashed var(--gold);padding:2px 4px;transition:background 0.2s;}
[contenteditable="true"]:focus{background:rgba(212,160,23,0.1);border-radius:4px;}

.editable-title{font-size:0.95rem;font-weight:700;color:var(--dark);margin-bottom:6px;}
.editable-desc{font-size:0.75rem;color:#666;margin-bottom:12px;}
.editable-price{font-size:1.1rem;font-weight:800;color:var(--red);font-family:"Playfair Display",serif;}

.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-top:1px solid var(--gray2);padding-top:10px;}
.btn-del-live{background:none;border:none;color:#999;cursor:pointer;font-size:0.8rem;}
.btn-del-live:hover{color:var(--red);}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);z-index:1100;background:var(--dark);color:#fff;padding:12px 24px;border-radius:30px;font-size:0.8rem;font-weight:600;opacity:0;transition:all 0.35s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<!-- BARRA SUPERIOR -->
<div class="editor-topbar">
  <h2>⚡ Editor Visual en Vivo · Tienda Perú</h2>
  <div class="editor-actions">
    <a href="admin.html" class="btn-back">← Volver al Panel</a>
    <button class="btn-save-all" id="btnSaveAll">💾 Guardar Cambios en Firebase</button>
  </div>
</div>

<div class="editor-container">
  <div class="editor-banner">
    <h1>Edita tu tienda haciendo clic</h1>
    <p>Haz clic directamente sobre cualquier título, descripción o precio para modificarlo. Luego presiona "Guardar Cambios".</p>
  </div>

  <div class="live-grid" id="liveGrid">
    <div style="grid-column:1/-1; text-align:center; padding:40px; color:#666;">Cargando productos desde Firebase...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- LÓGICA DE CONEXIÓN Y EDICIÓN -->
<script type="module">
  import { db } from "./firebase-config.js";
  import { collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  let productosLocales = [];

  async function cargarEditorVisual() {
    try {
      const snap = await getDocs(collection(db, "productos"));
      const grid = document.getElementById("liveGrid");
      if (snap.empty) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#666;">No hay productos registrados en Firestore.</div>`;
        return;
      }

      productosLocales = [];
      grid.innerHTML = "";

      snap.forEach(d => {
        const p = d.data();
        const id = d.id;
        productosLocales.push({ id, ...p });

        const card = document.createElement("div");
        card.className = "live-card";
        card.innerHTML = `
          <img src="${p.img || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'}" alt="${p.name}"/>
          <div class="editable-title" contenteditable="true" data-id="${id}" data-field="name">${p.name}</div>
          <div class="editable-desc" contenteditable="true" data-id="${id}" data-field="desc">${p.desc || "Sin descripción"}</div>
          <div class="card-foot">
            <div>RD$ <span class="editable-price" contenteditable="true" data-id="${id}" data-field="price">${p.price ?? 0}</span></div>
            <button class="btn-del-live" onclick="window.eliminarProductoLive('${id}')">🗑️ Eliminar</button>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (e) {
      console.error("Error al cargar editor visual:", e);
      showToast("Error al conectar con Firebase");
    }
  }

  // Guardar cambios masivos en tiempo real
  document.getElementById("btnSaveAll").addEventListener("click", async () => {
    try {
      const titles = document.querySelectorAll('[data-field="name"]');
      const descs = document.querySelectorAll('[data-field="desc"]');
      const prices = document.querySelectorAll('[data-field="price"]');

      const actualizaciones = {};

      titles.forEach(el => {
        const id = el.dataset.id;
        if (!actualizaciones[id]) actualizaciones[id] = {};
        actualizaciones[id].name = el.textContent.trim();
      });

      descs.forEach(el => {
        const id = el.dataset.id;
        if (!actualizaciones[id]) actualizaciones[id] = {};
        actualizaciones[id].desc = el.textContent.trim();
      });

      prices.forEach(el => {
        const id = el.dataset.id;
        if (!actualizaciones[id]) actualizaciones[id] = {};
        actualizaciones[id].price = parseFloat(el.textContent.trim()) || 0;
      });

      for (const id in actualizaciones) {
        const ref = doc(db, "productos", id);
        await updateDoc(ref, actualizaciones[id]);
      }

      showToast("✅ ¡Cambios guardados en Firebase con éxito!");
    } catch (e) {
      console.error("Error al guardar:", e);
      showToast("❌ Hubo un error al guardar los cambios");
    }
  });

  window.eliminarProductoLive = async function(id) {
    if (!confirm("¿Seguro que deseas eliminar este producto visualmente?")) return;
    try {
      await deleteDoc(doc(db, "productos", id));
      showToast("🗑️ Producto eliminado");
      cargarEditorVisual();
    } catch (e) {
      showToast("Error al eliminar");
    }
  };

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  document.addEventListener("DOMContentLoaded", cargarEditorVisual);
</script>
</body>
</html>
